name: Goteo de Mensajes Chats (Telegram & WhatsApp)

on:
  schedule:
    - cron: '0 10 * * *'  # Todos los días a las 15:00 UTC (17:00h de la tarde en España)
  workflow_dispatch:      # Botón de ejecución manual

jobs:
  enviar_goteo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Lanzar Publicador con Espaciado Real
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_CHATS: ${{ secrets.TELEGRAM_SECRET_CHATS }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_CHAT_ID_CHATS: ${{ secrets.WHATSAPP_CHAT_ID_CHATS }}
          MINUTOS_ESPACIADO: 15  # 👈 Aquí le dejas los 15 minutos reales para producción
        run: |
          python automation/publicador_chats.py