name: 1.3 Web - Generar Linktree Interactivo

on:
  workflow_run:
    workflows: ["1.1 Scraping - Fourvenues"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar_linktree:
    runs-on: ubuntu-latest
    # Solo se ejecuta si el workflow_run anterior fue un éxito o si se lanzó manualmente
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Generar Linktree web (index.html)
        run: python automation/generar_linktree.py

      - name: 2. Guardar web en repositorio (Protegido contra conflictos)
        run: |
          git config --global user.name "NextPlan Bot"
          git config --global user.email "bot@nextplan.es"
          
          # Actualizamos con origin para evitar conflictos si hubiese commits ajenos
          git fetch origin main
          
          git add index.html
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(web): regenerar Linktree interactivo con eventos actualizados"
            # Hacemos rebase forzando nuestra web generada en caso de conflicto
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull -X theirs --no-edit origin main)
            git push origin main
          else
            echo "El Linktree ya está actualizado. Sin cambios."
          fi

      - name: 🚨 Notificar fallo por Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          MENSAJE="🚨 *Error en GitHub Actions* 🚨%0A%0A*Workflow*: ${{ github.workflow }}%0A*Run*: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A%0AFalló la generación y publicación del Linktree web."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -d text="${MENSAJE}" \
            -d parse_mode="Markdown"
