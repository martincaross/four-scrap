name: 2. Previa - Aviso Previo al Goteo

on:
  schedule:
    - cron: '22 6 * * *'  # Diario a las 06:22 UTC (08:22h en España)
  workflow_dispatch: {}

jobs:
  enviar_previa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests tzdata

      - name: Enviar previa de eventos de hoy
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python automation/aviso_previo_goteo.py
