name: Difusión Manual Inmediata (Selectivo)

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'Canal de difusión'
        required: true
        default: 'solo_whatsapp'
        type: choice
        options:
          - solo_whatsapp
          - solo_telegram
          - ambos

jobs:
  difusion_manual:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Lanzar Publicador Inmediato (Sin esperas)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_CHATS: ${{ secrets.TELEGRAM_SECRET_CHATS }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_CHAT_ID_CHATS: ${{ secrets.WHATSAPP_CHAT_ID_CHATS }}
          TELEGRAM_ENABLED: ${{ inputs.canal == 'ambos' || inputs.canal == 'solo_telegram' }}
          WHATSAPP_ENABLED: ${{ inputs.canal == 'ambos' || inputs.canal == 'solo_whatsapp' }}
          MINUTOS_ESPACIADO: 0
        run: |
          python automation/publicador_chats.py
