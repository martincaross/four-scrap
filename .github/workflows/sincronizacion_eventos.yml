name: 1. Sincronizacion - Scraping, Base de Datos y Web

on:
  schedule:
    - cron: '0 06 * * *'  # Diario a las 06:00 UTC (08:00h en Espana)
  workflow_dispatch:
    inputs:
      wipe_db:
        description: 'Activar para borrar todos los eventos antiguos antes de subir los nuevos (Wipe)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sincronizar_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 1. Descubrir eventos activos en Fourvenues
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python src/scraper_events.py

      - name: 2. Descargar eventos nuevos
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python src/scraper.py

      - name: 3. Sincronizar Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event.inputs.wipe_db }}" == "true" ]; then
            python src/sync_firestore.py --wipe
          else
            python src/sync_firestore.py
          fi

      - name: 4. Generar pagina web Linktree
        run: python automation/generar_linktree.py

      - name: 5. Guardar cambios en repositorio
        run: |
          git config --global user.name "NextPlan Bot"
          git config --global user.email "bot@nextplan.es"
          git add data/ depuracion/ index.html
          git commit -m "chore: actualización nocturna de cartelera" || true
          git pull --rebase origin main
          git push origin main