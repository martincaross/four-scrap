name: 4. Monitorizacion - Estado de Sesion WhatsApp

on:
  schedule:
    - cron: '30 6,17 * * *'  # 08:30h y 19:30h en Espana (Keep-Alive y monitorizacion)
    - cron: '30 10 * * *'    # 12:30h en Espana (Media hora antes del goteo: Previa de eventos + salud)
  workflow_dispatch:
    inputs:
      enviar_previa:
        description: 'Enviar tambien la lista previa de eventos de hoy'
        required: false
        type: boolean
        default: true

jobs:
  comprobar_salud:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Comprobar estado de sesion WhatsApp
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          SILENCIAR_SI_OK: ${{ github.event.schedule == '30 10 * * *' || github.event.inputs.enviar_previa == 'true' }}
        run: |
          python automation/check_whatsapp_health.py

      - name: Enviar previa de eventos (12:30h o bajo demanda)
        if: github.event.schedule == '30 10 * * *' || github.event.inputs.enviar_previa == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python automation/aviso_previo_goteo.py
