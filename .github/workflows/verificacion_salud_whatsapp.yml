name: Verificación Salud WhatsApp (12:00h Diaria)

on:
  schedule:
    - cron: '0 10 * * *'  # Todos los días a las 10:00 UTC (12:00h de España)
  workflow_dispatch:      # Permite comprobación manual en cualquier momento

jobs:
  comprobar_salud:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Health Check de WhatsApp
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || '8769199362' }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python automation/check_whatsapp_health.py
