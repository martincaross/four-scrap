name: 4. Monitorizacion - Estado de Sesion WhatsApp

on:
  schedule:
    - cron: '0 6,10,16 * * *'  # 08:00h, 12:00h y 18:00h en Espana (Keep-Alive y monitorizacion)
  workflow_dispatch:

jobs:
  comprobar_salud:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Comprobar estado de sesion WhatsApp
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WHATSAPP_SERVER_URL: ${{ secrets.WHATSAPP_SERVER_URL }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python automation/check_whatsapp_health.py
